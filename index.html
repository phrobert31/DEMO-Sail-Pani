[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--d);color:var(--ink);line-height:1.08;letter-spacing:-.022em;font-weight:700}
h1{font-size:clamp(2.5rem,6vw,4.4rem)}
h2{font-size:clamp(1.75rem,3.4vw,2.6rem);margin-bottom:1.4rem}
h3{font-size:1.2rem;letter-spacing:-.012em}
p{max-width:64ch}
a{color:var(--sea-d)}
h1:focus,main:focus{outline:none}
:focus-visible{outline:2px solid var(--sea);outline-offset:3px}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:10px 14px;z-index:100;border-radius:6px}
.skip:focus{left:12px}
.eyebrow{font:600 .78rem var(--s);letter-spacing:.14em;text-transform:uppercase;color:var(--sea)}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:26px;height:70px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:auto}
.brand img{width:44px;height:auto;flex:none}
.brand b{font:700 1.3rem var(--d);letter-spacing:-.035em;color:var(--ink)}
.brand b i{font-style:normal;color:var(--sea)}
#nav{display:flex;gap:4px}
#nav a{color:var(--ink);text-decoration:none;font:500 .98rem var(--s);padding:8px 13px;border-radius:7px;white-space:nowrap}
#nav a:hover{background:var(--mist)}
#nav a[aria-current=page]{background:var(--ink);color:#fff}
.lang{position:relative;flex:none}
.lang>button{display:flex;align-items:center;gap:6px;font:600 .88rem var(--s);background:#fff;border:1px solid var(--line);color:var(--ink);padding:8px 11px;border-radius:7px;cursor:pointer}
.lang>button::after{content:"";width:5px;height:5px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg) translateY(-2px)}
.lang ul{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 12px 32px rgba(11,29,40,.13);list-style:none;padding:5px;margin:0;min-width:152px}
.lang li button{display:block;width:100%;text-align:left;background:none;border:0;font:500 .95rem var(--s);color:var(--ink);padding:9px 11px;border-radius:6px;cursor:pointer}
.lang li button:hover{background:var(--mist)}
.lang li button[aria-pressed=true]{background:var(--mist);font-weight:700}
.burger{display:none;width:42px;height:42px;place-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:pointer;flex:none}
.burger svg{width:18px;height:18px}
@media (max-width:980px){
  .bar{gap:10px}
  .burger{display:grid}
  #nav{display:none;position:absolute;left:0;right:0;top:70px;background:#fff;flex-direction:column;gap:0;padding:8px 20px 18px;border-bottom:1px solid var(--line)}
  #nav.open{display:flex}
  #nav a{padding:14px 12px}
}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font:600 1rem var(--s);background:var(--ink);color:#fff;text-decoration:none;padding:14px 24px;border-radius:9px;border:1.5px solid var(--ink);cursor:pointer;transition:transform .12s ease}
.btn:hover{background:var(--ink-2);border-color:var(--ink-2);transform:translateY(-1px)}
.btn svg{width:17px;height:17px;flex:none}
.btn-2{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-2:hover{background:var(--mist);border-color:var(--ink);color:var(--ink)}
.btn-l{background:#fff;color:var(--ink);border-color:#fff}
.btn-l:hover{background:var(--mist);border-color:var(--mist)}
.linkish{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;padding:2px}

/* hero */
.hero{padding:82px 0 70px;display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:center}
.hero h1{margin:16px 0 0}
.hero h1 em{font-style:normal;color:var(--sea);display:block}
.lead{font-size:1.22rem;margin:22px 0 32px;max-width:48ch;color:var(--body)}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:flex;gap:26px;flex-wrap:wrap;margin-top:38px;padding-top:26px;border-top:1px solid var(--line)}
.trust div{min-width:112px}
.trust b{display:block;font:700 1.6rem/1.1 var(--d);color:var(--ink);letter-spacing:-.03em}
.trust span{font-size:.9rem;color:var(--muted)}
@media (max-width:920px){.hero{grid-template-columns:1fr;gap:34px;padding:44px 0 50px}}

.photo{margin:0}
.photo img{display:block;width:100%;height:auto;border-radius:14px;object-fit:cover}
.hero-photo img{aspect-ratio:4/3}
.photo figcaption{font-size:.84rem;color:var(--muted);margin-top:10px}
.card{overflow:hidden}
.card-img{display:block;width:calc(100% + 68px);max-width:none;margin:-34px -34px 26px;aspect-ratio:16/9;object-fit:cover}
@media (max-width:820px){.card-img{width:calc(100% + 48px);margin:-24px -24px 20px}}
/* map figure */
.mapfig{margin:0}
.mapfig svg{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line)}
.mapfig figcaption{font-size:.84rem;color:var(--muted);margin-top:10px}
.m-sea{fill:var(--mist)}
.m-land{fill:#CBD9DF}
.m-land-hi{fill:var(--ink)}
.m-label,.m-label-d{font:600 14px var(--s);fill:var(--ink);stroke:#fff;stroke-width:3.5;paint-order:stroke fill;stroke-linejoin:round}
.m-region{font:700 13px var(--s);fill:#8FA5B0;letter-spacing:.18em}
.m-sub{font:500 11px var(--s);fill:var(--muted)}
.m-route{fill:none;stroke:var(--sea);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s ease-out .4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* sections */
.band{padding:88px 0}
.band-mist{background:var(--mist-2);border-block:1px solid var(--line)}
.band-ink{background:var(--ink);color:#C6D8DF}
.band-ink h2,.band-ink h3{color:#fff}
.sec-head{max-width:62ch;margin-bottom:42px}
.sec-head p{font-size:1.1rem;color:var(--muted)}

/* service cards */
.svc{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px;display:flex;flex-direction:column}
@media (max-width:820px){.card{padding:24px}}
.card .num{font:700 .8rem var(--s);letter-spacing:.12em;color:var(--sea);text-transform:uppercase;margin-bottom:14px}
.card h3{font-size:1.6rem;margin-bottom:10px}
.card p{margin-bottom:18px}
.card ul{list-style:none;padding:0;margin:0 0 26px}
.card li{position:relative;padding:7px 0 7px 24px;font-size:.98rem;border-bottom:1px solid var(--mist)}
.card li::before{content:"";position:absolute;left:2px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--sea)}
.card .btn{align-self:flex-start;margin-top:auto}
@media (max-width:820px){.svc{grid-template-columns:1fr}}

/* feature grid */
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:34px}
.feat h3{margin:14px 0 8px}
.feat .ic{width:40px;height:40px;border-radius:10px;background:var(--mist);display:grid;place-items:center}
.feat .ic svg{width:21px;height:21px;stroke:var(--sea);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:820px){.feat{grid-template-columns:1fr;gap:26px}}

/* page head */
.phead{background:var(--ink);color:#BFD3DB;padding:70px 0 62px}
.phead h1{color:#fff;margin:14px 0 16px;font-size:clamp(2.1rem,4.6vw,3.4rem)}
.phead p{font-size:1.15rem;max-width:56ch;color:#BFD3DB}
.phead .eyebrow{color:var(--sand)}
.phead-logo{width:230px;max-width:70%;height:auto;display:block;margin-bottom:26px}

/* price strip */
.price{display:flex;align-items:center;gap:28px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:16px;padding:30px 34px}
.price b{font:700 3rem/1 var(--d);letter-spacing:-.04em;color:#fff}
.price .t{font-size:1.02rem;color:#BFD3DB;max-width:52ch}
.price .btn{margin-left:auto}
@media (max-width:760px){.price .btn{margin-left:0}}

/* two col */
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.two-map{grid-template-columns:.9fr 1.1fr;align-items:center}
@media (max-width:880px){.two,.two-map{grid-template-columns:1fr;gap:34px}}

/* list blocks */
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.blk{border:1px solid var(--line);border-radius:14px;padding:26px 28px;background:#fff}
.blk h3{margin-bottom:8px}
.blk p{font-size:.98rem;color:var(--body)}
@media (max-width:820px){.blocks{grid-template-columns:1fr}}

.checks{list-style:none;padding:0;columns:2;column-gap:40px}
.checks li{position:relative;padding:9px 0 9px 28px;border-bottom:1px solid var(--line);break-inside:avoid}
.checks li::before{content:"";position:absolute;left:2px;top:14px;width:13px;height:8px;border-left:2px solid var(--sea);border-bottom:2px solid var(--sea);transform:rotate(-45deg)}
@media (max-width:700px){.checks{columns:1}}

.note{display:flex;gap:14px;align-items:flex-start;background:var(--mist);border-radius:12px;padding:18px 20px;margin-top:26px;font-size:.98rem}
.note::before{content:"";flex:none;width:4px;align-self:stretch;background:var(--sand);border-radius:2px}

/* steps */
.steps{list-style:none;padding:0;counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.steps li{counter-increment:s;padding-top:52px;position:relative}
.steps li::before{content:counter(s);position:absolute;top:0;left:0;width:38px;height:38px;border-radius:11px;background:var(--sea);color:#fff;display:grid;place-items:center;font:700 1.05rem var(--d)}
.steps h3{font-size:1.06rem;margin-bottom:5px}
.steps p{font-size:.95rem;color:var(--muted)}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* routes */
.routes{list-style:none;padding:0;margin:0}
.routes li{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);font-weight:500;color:var(--ink);font-size:1.05rem;flex-wrap:wrap}
.routes .arw{color:var(--sea);font-weight:700}
.routes .nm{font-size:.86rem;color:var(--muted);font-weight:400;margin-left:auto}

/* faq */
.faq{border-top:1px solid var(--line);max-width:860px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:20px 44px 20px 0;font:600 1.1rem var(--d);color:var(--ink);position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";position:absolute;right:10px;top:27px;width:9px;height:9px;border-right:2px solid var(--sea);border-bottom:2px solid var(--sea);transform:rotate(45deg);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(-135deg)}
.faq details p{padding:0 0 22px;color:var(--body)}

/* form */
.formcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px}
.field{margin-bottom:18px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
label{display:block;font:600 .92rem var(--s);color:var(--ink);margin-bottom:6px}
input,select,textarea{width:100%;font:400 1rem var(--s);color:var(--body);padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sea);outline-offset:1px;border-color:var(--sea)}
textarea{min-height:130px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:8px 15px;font:500 .93rem var(--s);color:var(--ink);cursor:pointer}
.chip input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.chip input:focus-visible+span{outline:2px solid var(--sea);outline-offset:2px}
.f-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.f-err{color:var(--red);font-weight:600;min-height:1.5em;margin-top:10px;font-size:.95rem}
.f-note{font-size:.88rem;color:var(--muted);margin-top:4px}
@media (max-width:560px){.f2{grid-template-columns:1fr}.formcard{padding:24px}}

/* contact details */
dl.info{display:grid;grid-template-columns:auto 1fr;gap:14px 26px;margin:0}
dl.info dt{font:600 .95rem var(--s);color:var(--muted)}
dl.info dd{margin:0;color:var(--ink);font-weight:500}
dl.info a{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--sea)}
dl.info a:hover{color:var(--sea)}
.bio p{margin-bottom:14px}
.portrait{margin:0 0 26px;width:min(320px,100%)}
.portrait img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 30%;border-radius:16px}
.portrait figcaption{font-size:.85rem;color:var(--muted);margin-top:10px}
.cta-face{display:flex;align-items:center;gap:18px}
.cta-face img{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:50% 28%;flex:none;border:2px solid rgba(255,255,255,.25)}
.mapbox{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--mist)}
.mapbox iframe{display:block;width:100%;height:360px;border:0}
.mapph{min-height:300px;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:36px}
.mapph p{max-width:44ch;font-size:.97rem}

/* footer */
footer{background:var(--ink);color:#93AEBA;padding:56px 0 30px;font-size:.94rem}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:34px}
footer h4{font:700 1rem var(--d);color:#fff;margin-bottom:14px}
footer a,footer .linkish{color:#D5E3E9;text-decoration:none;display:inline-block;padding:3px 0}
footer a:hover,footer .linkish:hover{color:#fff;text-decoration:underline}
footer nav{display:flex;flex-direction:column}
.fbrand img{width:210px;max-width:100%;height:auto;display:block}
.fbot{margin-top:38px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.87rem}
@media (max-width:760px){.fgrid{grid-template-columns:1fr;gap:26px}}

.wa{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;background:var(--sea);display:grid;place-items:center;box-shadow:0 8px 22px rgba(14,124,139,.4);z-index:60}
.wa:hover{background:var(--sea-d)}
.wa svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}

/* cookie + privacy */
.ck{position:fixed;left:16px;bottom:16px;max-width:520px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 44px rgba(11,29,40,.18);padding:22px;z-index:70}
.ck p{font-size:.95rem;margin-bottom:14px}
.ck-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ck .btn{padding:10px 18px;font-size:.95rem}
body.ck-on .wa{bottom:auto;top:-999px}
@media (max-width:600px){.ck{left:10px;right:10px;bottom:10px}}
dialog{max-width:680px;width:calc(100% - 32px);max-height:calc(100% - 48px);border:0;border-radius:16px;padding:34px;color:var(--body);box-shadow:0 30px 70px rgba(11,29,40,.3)}
dialog::backdrop{background:rgba(11,29,40,.55)}
dialog h2{margin-bottom:16px}
dialog p{margin-bottom:12px;font-size:.98rem}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.m-route{animation:none;stroke-dashoffset:0}.btn:hover{transform:none}}
</style>
</head>
<body>
<a class="skip" href="#main" id="skip" data-t="ui.skip"></a>

<header class="hdr">
  <div class="wrap bar">
    <a class="brand" href="#home" aria-label="sail&amp;clean">
      <img id="logo-mark" alt="" aria-hidden="true">
      <b>sail<i>&amp;</i>clean</b>
    </a>
    <nav id="nav" aria-label="Main">
      <a href="#home" data-t="nav.home"></a>
      <a href="#pulizia" data-t="nav.clean"></a>
      <a href="#trasferimenti" data-t="nav.deliv"></a>
      <a href="#contatti" data-t="nav.contact"></a>
    </nav>
    <div class="lang">
      <button type="button" id="lang-btn" aria-expanded="false" aria-haspopup="true"><span id="lang-cur">IT</span></button>
      <ul id="lang-menu" hidden></ul>
    </div>
    <button class="burger" type="button" aria-expanded="false" aria-controls="nav" data-ta="ui.menu">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M1 4h16M1 9h16M1 14h16" stroke="#0B1D28" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main id="main" tabindex="-1">

<!-- HOME -->
<section class="page" data-p="home">
  <div class="wrap hero">
    <div>
      <span class="eyebrow" data-t="home.eyebrow"></span>
      <h1><span data-t="home.h1a"></span><em data-t="home.h1b"></em></h1>
      <p class="lead" data-t="home.lead"></p>
      <div class="cta-row">
        <a class="btn" href="#pulizia" data-t="home.cta1"></a>
        <a class="btn btn-2" href="#trasferimenti" data-t="home.cta2"></a>
      </div>
      <div class="trust">
        <div><b>30 m</b><span data-t="home.t1"></span></div>
        <div><b>20 m</b><span data-t="home.t2"></span></div>
        <div><b>7 €</b><span data-t="home.t3"></span></div>
      </div>
    </div>
    <figure class="photo hero-photo">
      <img id="img-hero" alt="" data-ta="img.hero">
      <figcaption data-t="map.capHome"></figcaption>
    </figure>
  </div>

  <section class="band band-mist">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-t="home.svcTitle"></h2>
        <p data-t="home.svcSub"></p>
      </div>
      <div class="svc">
        <article class="card">
          <img class="card-img" id="img-c1" alt="" data-ta="img.c1">
          <span class="num">01</span>
          <h3 data-t="home.c1h"></h3>
          <p data-t="home.c1p"></p>
          <ul id="home-c1"></ul>
          <a class="btn" href="#pulizia" data-t="home.c1btn"></a>
        </article>
        <article class="card">
          <img class="card-img" id="img-c2" alt="" data-ta="img.c2">
          <span class="num">02</span>
          <h3 data-t="home.c2h"></h3>
          <p data-t="home.c2p"></p>
          <ul id="home-c2"></ul>
          <a class="btn" href="#trasferimenti" data-t="home.c2btn"></a>
        </article>
      </div>
    </div>
  </section>

  <section class="band">
    <div class="wrap">
      <div class="sec-head"><h2 data-t="home.whyTitle"></h2></div>
      <div class="feat" id="home-why"></div>
    </div>
  </section>

  <section class="band band-ink">
    <div class="wrap">
      <div class="two" style="align-items:center">
        <div class="cta-face">
          <img id="face-sm" alt="" data-ta="contact.photoAlt">
          <div>
            <h2 data-t="home.ctaTitle"></h2>
            <p data-t="home.ctaText"></p>
          </div>
        </div>
        <div class="cta-row" style="justify-content:flex-end">
          <a class="btn btn-l" data-h="wa" target="_blank" rel="noopener" data-t="ui.whatsapp"></a>
          <a class="btn btn-l" href="#contatti" data-t="ui.contact"></a>
        </div>
      </div>
    </div>
  </section>
</section>

<!-- PULIZIA -->
<section class="page" data-p="pulizia" hidden>
  <header class="phead">
    <div class="wrap">
      <span class="eyebrow" data-t="clean.eyebrow"></span>
      <h1 tabindex="-1" data-t="clean.h1"></h1>
      <p data-t="clean.intro"></p>
    </div>
  </header>

  <section class="band">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-t="clean.whatTitle"></h2>
        <p data-t="clean.whatSub"></p>
      </div>
      <div class="two two-map">
        <div>
          <ul class="checks" id="clean-list"></ul>
          <div class="note"><p data-t="clean.noHull"></p></div>
        </div>
        <figure class="photo">
          <img id="img-clean" alt="" data-ta="img.clean">
        </figure>
      </div>
    </div>
  </section>

  <section class="band band-mist">
    <div class="wrap two">
      <div>
        <h2 data-t="clean.prodTitle"></h2>
        <p data-t="clean.prodSub"></p>
      </div>
      <div class="blocks" style="grid-template-columns:1fr">
        <div class="blk"><h3 data-t="clean.prod1h"></h3><p data-t="clean.prod1p"></p></div>
        <div class="blk" style="border-color:var(--sea);border-width:1.5px">
          <h3><span data-t="clean.prod2h"></span></h3><p data-t="clean.prod2p"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="band">
    <div class="wrap two-map two">
      <div>
        <h2 data-t="clean.areaTitle"></h2>

function mapSVG(kind){
  const g = kind==="routes" ? GEO.routes : GEO.sard;
  const x0 = kind==="routes" ? 0 : -140, w = kind==="routes" ? 600 : 800, h = kind==="routes" ? 760 : 680;
  let s = `<svg viewBox="${x0} 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet">`;
  s += `<rect x="${x0}" width="${w}" height="${h}" class="m-sea"/>`;
  if(kind==="sard") s += `<text x="640" y="655" class="m-region" text-anchor="end">SARDEGNA</text>`;
  const big = g.paths[0];
  g.paths.forEach((d,i)=>{ s += `<path d="${d}" class="${kind==="sard"&&i===0?"m-land-hi":"m-land"}"/>`; });
  const dot=(x,y,r,cls)=>`<circle cx="${x}" cy="${y}" r="${r}" class="${cls}"/>`;
  if(kind==="sard"){
    const P=g.pts;
    const ports=[["portoTorres","Porto Torres",1,0],["alghero","Alghero e Fertilia",-1,0],["bosa","Bosa",-1,0],
      ["cannigione","Cannigione",-1,-6],["costaSmeralda","Costa Smeralda",1,-8],["portisco","Portisco",1,6],
      ["olbia","Olbia",1,2],["sanTeodoro","San Teodoro",1,0]];
    ports.forEach(([k,label,side,dy])=>{
      const [x,y]=P[k];
      s += `<circle cx="${x}" cy="${y}" r="5.5" fill="#0E7C8B" stroke="#fff" stroke-width="2"/>`;
      s += `<text x="${x+(side>0?12:-12)}" y="${y+4+dy}" class="m-label" text-anchor="${side>0?"start":"end"}">${label}</text>`;
    });
  } else {
    const P=g.pts;
    const routes=[[P.portoTorres,P.andora],[P.alassio,P.portoTorres],[P.fertilia,P.portoVecchio]];
    routes.forEach(([a,b],i)=>{
      const mx=(a[0]+b[0])/2 + (i===2?-26:34), my=(a[1]+b[1])/2;
      s += `<path d="M${a[0]},${a[1]} Q${mx},${my} ${b[0]},${b[1]}" class="m-route" pathLength="1" style="animation-delay:${0.3+i*0.35}s"/>`;
    });
    const labels=[["alassio","Alassio · Andora",1],["portoVecchio","Porto Vecchio",1],["portoTorres","Porto Torres",-1],["fertilia","Fertilia",-1]];
    labels.forEach(([k,label,side])=>{
      const [x,y]=P[k];
      s += `<circle cx="${x}" cy="${y}" r="5.5" fill="#0B1D28" stroke="#fff" stroke-width="2"/>`;
      s += `<text x="${x+(side>0?11:-11)}" y="${y+4}" class="m-label-d" text-anchor="${side>0?"start":"end"}">${label}</text>`;
    });
    s += `<text x="72" y="52" class="m-region">LIGURIA</text>`;
    s += `<text x="300" y="424" class="m-region" text-anchor="middle">CORSICA</text>`;
    s += `<text x="300" y="714" class="m-region" text-anchor="middle">SARDEGNA</text>`;
  }
  s += `</svg>`;
  return s;
}

               '<path d="M4 20h16M6 20V9l6-5 6 5v11"/><path d="M10 20v-5h4v5"/>',
               '<path d="M4 7h16M4 12h10M4 17h7"/><circle cx="18" cy="16" r="3"/>'];
  $("#home-why").innerHTML=L.home.why.map((w,i)=>
    `<div><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[i]}</svg></div><h3>${esc(w.t)}</h3><p>${esc(w.d)}</p></div>`).join("");
  $("#clean-list").innerHTML=li(L.clean.list);
  $("#clean-ports").innerHTML=li(L.clean.ports);
  const steps=a=>a.map(s=>`<li><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p></li>`).join("");
  $("#clean-steps").innerHTML=steps(L.clean.steps);
  $("#deliv-steps").innerHTML=steps(L.deliv.steps);
  $("#deliv-routes").innerHTML=L.deliv.routes.map(r=>{
    const [a,b]=r.split("→");
    return `<li><span>${esc(a.trim())}</span><span class="arw">→</span><span>${esc(b.trim())}</span></li>`;
  }).join("");
  $("#deliv-costs").innerHTML=L.deliv.costs.map(c=>`<div class="blk"><h3>${esc(c.t)}</h3><p>${esc(c.d)}</p></div>`).join("");
  $("#deliv-faq").innerHTML=L.deliv.faq.map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("");
  $("#pv-body").innerHTML=L.privacy.paras.map(p=>`<p>${esc(fill(p))}</p>`).join("");
  const checked=new Set([...$$("#f-chips input:checked")].map(i=>i.value));
  $("#f-chips").innerHTML=Object.entries(L.form.chips).map(([k,v])=>
    `<label class="chip"><input type="checkbox" value="${k}"${checked.has(k)?" checked":""}><span>${esc(v)}</span></label>`).join("");
  $("#lang-menu").innerHTML=LANGS.map(l=>
    `<li><button type="button" data-lang="${l}" aria-pressed="${l===lang}">${LANG_NAMES[l]}</button></li>`).join("");
}

function applyLang(){
  document.documentElement.lang=lang;
  $$("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  $$("[data-tp]").forEach(el=>el.placeholder=t(el.dataset.tp));
  $$("[data-ta]").forEach(el=>{const v=t(el.dataset.ta);el.setAttribute("aria-label",v);if(el.tagName==="IMG")el.alt=v;});
  $$("[data-tt]").forEach(el=>el.title=t(el.dataset.tt));
  $$(".mapfig svg").forEach(s=>s.setAttribute("aria-label",t("map.capHome")));
  $("#lang-cur").textContent=lang.toUpperCase();
  lists();
  $("#f-err").textContent="";
  title();
  history.replaceState(null,"","?lang="+lang+location.hash);
}

function title(){
  const n=t("nav."+({home:"home",pulizia:"clean",trasferimenti:"deliv",contatti:"contact"}[page]));
  document.title=(page==="home"?"":n+" · ")+"sail&clean, "+t("footer.blurb").replace(/\.$/,"");
}

function route(first){
  const id=location.hash.slice(1);
  if(!PAGES.includes(id)&&!first) return;
  page=PAGES.includes(id)?id:"home";
  $$(".page").forEach(p=>p.hidden=p.dataset.p!==page);
  $$("#nav a, footer nav a").forEach(a=>{
    a.getAttribute("href")==="#"+page?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current");
  });
  $("#nav").classList.remove("open");
  $(".burger").setAttribute("aria-expanded","false");
  title();
  if(!first){ window.scrollTo(0,0); const h=$(`.page[data-p="${page}"] h1`); if(h) h.focus({preventScroll:true}); }
}

function consent(v){
  mapOK=v;
  const f=$("#gmap");
  if(v){ if(!f.src) f.src=CONFIG.mapEmbed; f.hidden=false; $("#gmap-ph").hidden=true; }
  else { f.removeAttribute("src"); f.hidden=true; $("#gmap-ph").hidden=false; }
  banner(false);
}
function banner(show){ $("#ck").hidden=!show; document.body.classList.toggle("ck-on",show); }

function compose(){
  const L=T[lang];
  const v=id=>$(id).value.trim();
  const name=v("#f-name"), msg=v("#f-msg");
  if(!name||!msg){ $("#f-err").textContent=L.form.err; (!name?$("#f-name"):$("#f-msg")).focus(); return null; }
  $("#f-err").textContent="";
  const picked=[...$$("#f-chips input:checked")].map(i=>L.form.chips[i.value]).join(", ");
  const lines=[`${L.form.hello} ${name}.`];
  if(v("#f-boat")) lines.push(`${L.form.lBoat}: ${v("#f-boat")}`);
  if(v("#f-port")) lines.push(`${L.form.lPort}: ${v("#f-port")}`);
  if(picked) lines.push(`${L.form.lServices}: ${picked}`);
  if(v("#f-reach")) lines.push(`${L.form.lReach}: ${v("#f-reach")}`);
  return lines.join("\n")+"\n\n"+msg;
}

$("#face").src=FACE;$("#face-sm").src=FACE;
$("#logo-mark").src=LOGO_MARK;
$("#logo-foot").src=LOGO_WHITE;
$("#logo-head").src=LOGO_WHITE;
$("#img-hero").src=IMG.hero;$("#img-c1").src=IMG.c1;$("#img-c2").src=IMG.c2;$("#img-clean").src=IMG.clean;
applyConfig();
applyLang();
route(true);
banner(true);

addEventListener("hashchange",()=>route(false));
$("#lang-btn").addEventListener("click",()=>{
  const open=$("#lang-menu").hidden;
  $("#lang-menu").hidden=!open;
  $("#lang-btn").setAttribute("aria-expanded",String(open));
});
$("#lang-menu").addEventListener("click",e=>{
  const b=e.target.closest("[data-lang]"); if(!b) return;
  lang=b.dataset.lang; applyLang();
  $("#lang-menu").hidden=true; $("#lang-btn").setAttribute("aria-expanded","false"); $("#lang-btn").focus();
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".lang")){ $("#lang-menu").hidden=true; $("#lang-btn").setAttribute("aria-expanded","false"); }
});
$(".burger").addEventListener("click",()=>{
  const o=$("#nav").classList.toggle("open");
  $(".burger").setAttribute("aria-expanded",String(o));
});
$("#skip").addEventListener("click",e=>{e.preventDefault();$("#main").focus();});
$("#ck-yes").addEventListener("click",()=>consent(true));
$("#ck-no").addEventListener("click",()=>consent(false));
$("#map-load").addEventListener("click",()=>consent(true));
$("#ck-prefs").addEventListener("click",()=>{banner(true);$("#ck-yes").focus();});
$$("[data-privacy]").forEach(b=>b.addEventListener("click",()=>$("#privacy").showModal()));
$("#pv-close").addEventListener("click",()=>$("#privacy").close());
$("#send-wa").addEventListener("click",()=>{
  const m=compose(); if(m) window.open("https://wa.me/"+CONFIG.phoneIntl+"?text="+encodeURIComponent(m),"_blank","noopener");
});
$("#send-mail").addEventListener("click",()=>{
  const m=compose(); if(m) location.href="mailto:"+CONFIG.email+"?subject="+encodeURIComponent(t("form.subject"))+"&body="+encodeURIComponent(m);
});

</script>
</body>
</html>
