*,*::before,*::after{box-sizing:border-box;margin:0}
:root{
  --navy:#0F2A44;--navy-2:#1C4266;--ink:#2B4057;--muted:#5B6E81;
  --sea:#E4EDF4;--line:#C8D5E0;--brass:#9C7A2E;--red:#B3322B;
  --serif:"Alegreya",Georgia,serif;--sans:"Alegreya Sans",system-ui,sans-serif;
}
html{scroll-behavior:smooth}
body{font:400 1.0625rem/1.6 var(--sans);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--serif);color:var(--navy);line-height:1.15}
h1{font-weight:800;font-size:clamp(2.3rem,5.2vw,3.7rem);letter-spacing:-.01em}
h2{font-weight:700;font-size:clamp(1.6rem,3vw,2.1rem);margin-bottom:1.5rem}
h3{font-weight:700;font-size:1.3rem}
p{max-width:62ch}
a{color:var(--navy-2)}
h1:focus,main:focus{outline:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.wrap{width:min(1140px,100% - 40px);margin-inline:auto}
.skip{position:absolute;left:-999px;top:8px;background:var(--navy);color:#fff;padding:8px 12px;z-index:100}
.skip:focus{left:12px}

/* Header */
.site-header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:24px;height:68px;position:relative}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:800;font-size:1.2rem;color:var(--navy);text-decoration:none;margin-right:auto}
.brand svg{width:30px;height:30px;flex:none}
#nav{display:flex;gap:22px}
#nav a{color:var(--navy);text-decoration:none;font-weight:500;padding:6px 0;border-bottom:2px solid transparent;white-space:nowrap}
#nav a:hover{border-color:var(--line)}
#nav a[aria-current=page]{border-color:var(--brass)}
.lang{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex:none}
.lang button{font:500 .8rem var(--sans);background:#fff;color:var(--navy);border:0;padding:6px 9px;cursor:pointer;letter-spacing:.04em}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed=true]{background:var(--navy);color:#fff}
.menu-btn{display:none;width:40px;height:40px;place-items:center;background:#fff;border:1px solid var(--line);border-radius:3px;cursor:pointer;flex:none}
.menu-btn svg{width:20px;height:20px}
@media (max-width:1060px){
  .bar{gap:12px}
  .menu-btn{display:grid}
  #nav{display:none;position:absolute;top:68px;left:-20px;right:-20px;background:#fff;flex-direction:column;gap:0;padding:4px 20px 16px;border-bottom:1px solid var(--line)}
  #nav.open{display:flex}
  #nav a{padding:13px 0;border-bottom:1px solid var(--line)}
  #nav a[aria-current=page]{color:var(--brass);border-color:var(--line)}
}
@media (max-width:520px){
  .brand{font-size:1rem}
  .brand span{max-width:8.5em;line-height:1.05}
  .lang button{padding:6px 7px}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;font:700 1rem var(--sans);background:var(--navy);color:#fff;text-decoration:none;padding:12px 22px;border-radius:3px;border:2px solid var(--navy);cursor:pointer}
.btn:hover{background:var(--navy-2);border-color:var(--navy-2)}
.btn-ghost{background:transparent;color:var(--navy)}
.btn-ghost:hover{background:var(--sea);border-color:var(--navy)}
.btn-light{background:#fff;color:var(--navy);border-color:#fff}
.btn-light:hover{background:var(--sea);border-color:var(--sea)}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;padding:2px}

/* Hero */
.hero{display:grid;grid-template-columns:1fr 1.05fr;gap:56px;align-items:center;padding:64px 0 72px}
.hero h1 span{display:block}
.lead{font-size:1.2rem;margin:22px 0 30px;max-width:46ch}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.coords{margin-top:32px;font-family:var(--serif);font-style:italic;color:var(--navy);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.coords::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--red)}
.chart{border:1px solid var(--navy);padding:5px;background:#fff}
.chart svg{display:block;width:100%;height:auto;border:2px solid var(--navy)}
.chart figcaption{font:italic 400 .85rem var(--serif);color:var(--muted);padding:8px 2px 2px}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:36px;padding:40px 0 56px}}

/* Chart text */
.c-water{font-family:var(--serif);font-style:italic;font-size:19px;fill:var(--navy)}
.c-land{font-family:var(--sans);font-size:12px;font-weight:500;fill:#fff}
.c-region{font-family:var(--sans);font-size:14px;letter-spacing:.3em;fill:#9FB6CA}
.c-depth{font-family:var(--serif);font-style:italic;font-size:11px;fill:#5F7A92}
.c-grid{font-family:var(--sans);font-size:9px;fill:#6B7F92}
.c-coord{font-family:var(--serif);font-style:italic;font-size:11px;fill:var(--red)}
.c-n{font-family:var(--serif);font-weight:700;font-size:13px;fill:var(--navy);text-anchor:middle}
.c-num{font-family:var(--sans);font-weight:700;font-size:12px;fill:#fff;text-anchor:middle}
.route-anim{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s cubic-bezier(.4,0,.2,1) .5s forwards}
.sail-anim{opacity:0;animation:fade .5s ease 2.9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}

/* Sections */
.band{padding:80px 0}
.band-sea{background:var(--sea)}
.svc-list{list-style:none;padding:0;border-bottom:1px solid var(--line)}
.svc-list li{display:grid;grid-template-columns:minmax(200px,300px) 1fr auto;gap:24px;align-items:baseline;padding:22px 0;border-top:1px solid var(--line)}
.svc-list a{font-weight:700;text-decoration:none;color:var(--navy);border-bottom:1px solid var(--brass);white-space:nowrap}
.svc-list a:hover{color:var(--brass)}
@media (max-width:700px){.svc-list li{grid-template-columns:1fr;gap:6px}}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.how h3{padding-top:14px;border-top:3px solid var(--navy);margin-bottom:8px}
@media (max-width:800px){.how{grid-template-columns:1fr;gap:28px}}
.cta-band{background:var(--navy);color:#DCE6EF;padding:64px 0}
.cta-band h2{color:#fff;margin-bottom:8px}
.cta-inner{display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap}

.page-head{background:var(--navy);color:#D5E1EC;padding:64px 0 56px;border-bottom:4px solid var(--brass)}
.page-head h1{color:#fff;margin-bottom:14px}
.page-head p{font-size:1.18rem;max-width:58ch}

.blocks{display:grid;grid-template-columns:1fr 1fr;gap:48px 56px}
.block h3{border-top:3px solid var(--navy);padding-top:14px;margin-bottom:6px}
.block>p{margin-bottom:14px}
.checks{list-style:none;padding:0}
.checks li{position:relative;padding:8px 0 8px 26px;border-bottom:1px solid var(--line)}
.checks li::before{content:"";position:absolute;left:3px;top:17px;width:8px;height:8px;border:2px solid var(--brass);transform:rotate(45deg)}
.note{margin-top:36px;font-family:var(--serif);font-style:italic;font-size:1.1rem;color:var(--navy)}
.note+.note{margin-top:10px}
@media (max-width:760px){.blocks{grid-template-columns:1fr}}

.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:28px;counter-reset:s;margin-bottom:44px}
.steps li{counter-increment:s;position:relative;padding-top:58px}
.steps li::before{content:counter(s);position:absolute;top:0;left:0;width:42px;height:42px;border:2px solid var(--navy);border-radius:50%;display:grid;place-items:center;font:700 1.15rem var(--serif);color:var(--navy);background:#fff}
.steps li:not(:last-child)::after{content:"";position:absolute;top:21px;left:52px;right:-18px;border-top:1px dashed var(--navy)}
.steps h3{font-size:1.15rem;margin-bottom:4px}
@media (max-width:800px){.steps{grid-template-columns:1fr 1fr}.steps li::after{display:none!important}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}

.timetable{border-top:2px solid var(--navy);margin-bottom:18px}
.row{display:grid;grid-template-columns:240px 140px 1fr;gap:24px;padding:20px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row .dur{font:italic 700 1.15rem var(--serif);color:var(--brass)}
.spaced{margin-top:64px}
@media (max-width:720px){.row{grid-template-columns:1fr;gap:4px}}

.dest-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
.dest{list-style:none;padding:0;border-top:2px solid var(--navy)}
.dest li{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}
.dest .n{width:28px;height:28px;border-radius:50%;background:var(--brass);color:#fff;display:grid;place-items:center;font:700 .9rem var(--sans)}
.dest h3{font-size:1.15rem;margin-bottom:2px}
@media (max-width:860px){.dest-grid{grid-template-columns:1fr;gap:36px}}

.faq{border-top:2px solid var(--navy);max-width:820px;margin-bottom:44px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:18px 40px 18px 0;font:700 1.15rem var(--serif);color:var(--navy);position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:6px;top:12px;font:400 1.7rem var(--sans);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 20px}

/* Contact */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
.contact-grid h2{margin-bottom:14px}
.about p{margin-bottom:14px}
.role{font:italic 400 1.15rem var(--serif);color:var(--brass);margin:-6px 0 16px}
.log{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:28px 0 8px}
.log div{border-top:2px solid var(--navy);padding-top:10px}
.log dt{font-size:.9rem;color:var(--muted)}
.log dd{margin:2px 0 0;font:800 1.7rem/1.2 var(--serif);color:var(--navy)}
.log dd.small{font:700 1.02rem/1.3 var(--serif)}
@media (max-width:520px){.log{grid-template-columns:1fr 1fr}}
.details-h{margin-top:44px}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:12px 24px;border-top:2px solid var(--navy);padding-top:18px}
dl.info dt{font-weight:700;color:var(--navy)}
dl.info dd{margin:0}
.form-card{border:1px solid var(--navy);padding:32px;background:#fff;box-shadow:8px 8px 0 var(--sea)}
.field{margin-bottom:18px}
label{display:block;font-weight:700;color:var(--navy);margin-bottom:6px;font-size:.95rem}
input,select,textarea{width:100%;font:inherit;color:var(--ink);padding:11px 12px;border:1px solid #9FB3C4;border-radius:3px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--navy)}
textarea{min-height:150px;resize:vertical}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.form-error{color:var(--red);font-weight:700;min-height:1.6em;margin-top:10px}
.form-note{font-size:.9rem;color:var(--muted)}
.map{border:1px solid var(--navy);padding:5px;background:#fff}
.map iframe{display:block;width:100%;height:380px;border:2px solid var(--navy)}
.map-ph{min-height:320px;display:grid;place-content:center;justify-items:center;gap:16px;text-align:center;padding:32px;border:2px solid var(--navy);background:repeating-linear-gradient(0deg,#fff 0 39px,var(--sea) 39px 40px),#fff}
.map-ph p{max-width:46ch;background:#fff;padding:4px 8px}
.map-ph a{font-weight:700}
@media (max-width:860px){.contact-grid{grid-template-columns:1fr;gap:48px}.form-card{padding:22px}}

/* Footer */
footer{background:var(--navy);color:#B9CAD9;padding:44px 0;font-size:.92rem}
.foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.foot-brand{font-family:var(--serif);font-weight:800;color:#fff;font-size:1.15rem;margin-bottom:6px}
.foot-links{display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.foot nav{display:flex;gap:20px;flex-wrap:wrap}
footer a,footer .linkbtn{color:#fff;text-decoration:none}
footer a:hover,footer .linkbtn:hover{text-decoration:underline}
.legal{display:flex;gap:18px;flex-wrap:wrap}
@media (max-width:700px){.foot-links{align-items:flex-start}}

.wa-float{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;background:var(--navy);display:grid;place-items:center;box-shadow:0 4px 14px rgba(15,42,68,.35);z-index:60;border:2px solid #fff}
.wa-float:hover{background:var(--navy-2)}
.wa-float svg{width:26px;height:26px}

/* Cookie banner and privacy dialog */
.cookie{position:fixed;left:16px;bottom:16px;max-width:560px;background:var(--navy);color:#DCE6EF;padding:20px 22px;border-radius:4px;border-top:3px solid var(--brass);box-shadow:0 8px 30px rgba(15,42,68,.35);z-index:70}
.cookie p{font-size:.96rem;margin-bottom:14px}
.cookie-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cookie .btn{padding:9px 20px}
.cookie .linkbtn{color:#fff;margin-left:4px}
body.ck-open .wa-float{display:none}
@media (max-width:600px){.cookie{left:10px;right:10px;bottom:10px}}
dialog#privacy{max-width:660px;width:calc(100% - 32px);max-height:calc(100% - 48px);border:1px solid var(--navy);border-top:4px solid var(--brass);padding:32px;color:var(--ink)}
dialog::backdrop{background:rgba(15,42,68,.55)}
dialog h2{margin-bottom:16px}
dialog p{margin-bottom:12px}
dialog .btn{margin-top:8px}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .route-anim{animation:none;stroke-dashoffset:0}
  .sail-anim{animation:none;opacity:1}
  .faq summary::after{transition:none}
}
</style>
</head>
<body>

<a class="skip" href="#main" id="skip" data-i18n="skip"></a>

<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="#home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M15 3V22H5Z" fill="#0F2A44"/><path d="M17 8V22H25Z" fill="#9C7A2E"/><path d="M3 26.5q6.5-4 13 0t13 0" fill="none" stroke="#0F2A44" stroke-width="2"/></svg>
      <span data-cfg="name"></span>
    </a>
    <nav id="nav" aria-label="Main">
      <a href="#home" data-i18n="nav.home"></a>
      <a href="#cleaning" data-i18n="nav.cleaning"></a>
      <a href="#sailing" data-i18n="nav.sailing"></a>
      <a href="#skipper" data-i18n="nav.skipper"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="it" aria-label="Italiano">IT</button>
      <button type="button" data-lang="en" aria-label="English">EN</button>
      <button type="button" data-lang="de" aria-label="Deutsch">DE</button>
      <button type="button" data-lang="fr" aria-label="Français">FR</button>
    </div>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="nav" data-i18n-aria="menu">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 5h16M2 10h16M2 15h16" stroke="#0F2A44" stroke-width="2"/></svg>
    </button>
  </div>
</header>

<main id="main" tabindex="-1">

<!-- PAGE 1: HOME -->
<section class="page" data-page="home">
  <div class="wrap hero">
    <div>
      <h1 tabindex="-1"><span data-i18n="hero.t1"></span><span data-i18n="hero.t2"></span></h1>
      <p class="lead" data-i18n="hero.sub"></p>
      <div class="actions">
        <a class="btn" href="#contact" data-i18n="hero.cta1"></a>
        <a class="btn btn-ghost" href="#sailing" data-i18n="hero.cta2"></a>
      </div>
      <p class="coords"><span data-i18n="hero.coords"></span><span>40°50′N 8°24′E</span></p>
    </div>
    <figure class="chart">
      <div id="chart-hero"></div>
      <figcaption data-i18n="chart.caption"></figcaption>
    </figure>
  </div>
  <section class="band">
    <div class="wrap">
      <h2 data-i18n="home.whatTitle"></h2>
      <ul class="svc-list" id="svc-list"></ul>
    </div>
  </section>
  <section class="band band-sea">
    <div class="wrap">
      <h2 data-i18n="home.howTitle"></h2>
      <div class="how" id="how-list"></div>
    </div>
  </section>
  <section class="cta-band">
    <div class="wrap cta-inner">
      <div>
        <h2 data-i18n="home.ctaTitle"></h2>
        <p data-i18n="home.ctaText"></p>
      </div>
      <a class="btn btn-light" data-href="wa" target="_blank" rel="noopener" data-i18n="home.ctaBtn"></a>
    </div>
  </section>
</section>

<!-- PAGE 2: CLEANING & CARE -->
<section class="page" data-page="cleaning" hidden>
  <header class="page-head">
    <div class="wrap">
      <h1 tabindex="-1" data-i18n="clean.title"></h1>
      <p data-i18n="clean.intro"></p>
    </div>
  </header>
  <section class="band">
    <div class="wrap">
      <div class="blocks" id="clean-blocks"></div>
      <p class="note" data-i18n="clean.priceNote"></p>
    </div>
  </section>
  <section class="band band-sea">
    <div class="wrap">
      <h2 data-i18n="clean.processTitle"></h2>
      <ol class="steps" id="clean-steps"></ol>
      <a class="btn" href="#contact" data-svc="cleaning" data-i18n="clean.ctaBtn"></a>
    </div>
  </section>
</section>

<!-- PAGE 3: SAILING -->
<section class="page" data-page="sailing" hidden>
  <header class="page-head">
    <div class="wrap">
      <h1 tabindex="-1" data-i18n="sail.title"></h1>
      <p data-i18n="sail.intro"></p>
    </div>
  </header>
  <section class="band">
    <div class="wrap">
      <h2 data-i18n="sail.tripsTitle"></h2>
      <div class="timetable" id="trips"></div>
      <p class="note" data-i18n="sail.privateNote"></p>
      <h2 class="spaced" data-i18n="sail.lessonsTitle"></h2>
      <div class="timetable" id="lessons"></div>
      <p class="note" data-i18n="sail.priceNote"></p>
    </div>
  </section>
  <section class="band band-sea">
    <div class="wrap dest-grid">
      <figure class="chart">
        <div id="chart-dest"></div>
        <figcaption data-i18n="chart.caption"></figcaption>
      </figure>
      <div>
        <h2 data-i18n="sail.destTitle"></h2>
        <ol class="dest" id="dest"></ol>
      </div>
    </div>
  </section>
  <section class="band">
    <div class="wrap">
      <h2 data-i18n="sail.faqTitle"></h2>
      <div class="faq" id="faq"></div>
      <a class="btn" href="#contact" data-svc="trip" data-i18n="sail.ctaBtn"></a>
    </div>
  </section>
</section>

<!-- PAGE 4: SKIPPER & DELIVERY -->
<section class="page" data-page="skipper" hidden>
  <header class="page-head">
    <div class="wrap">
      <h1 tabindex="-1" data-i18n="skipper.title"></h1>
      <p data-i18n="skipper.intro"></p>
    </div>
  </header>
  <section class="band">
    <div class="wrap">
      <div class="blocks">
        <div class="block">
          <h3 data-i18n="skipper.deliveryTitle"></h3>
          <p data-i18n="skipper.deliveryText"></p>
          <ul class="checks" id="delivery-items"></ul>
        </div>
        <div class="block">
          <h3 data-i18n="skipper.hireTitle"></h3>
          <p data-i18n="skipper.hireText"></p>
          <ul class="checks" id="hire-items"></ul>
        </div>
      </div>
      <p class="note" data-i18n="skipper.costs"></p>
      <p class="note" data-i18n="skipper.priceNote"></p>
    </div>
  </section>
  <section class="band band-sea">
    <div class="wrap">
      <h2 data-i18n="skipper.processTitle"></h2>
      <ol class="steps" id="skipper-steps"></ol>
      <a class="btn" href="#contact" data-svc="delivery" data-i18n="skipper.ctaBtn"></a>
    </div>
  </section>
</section>

<!-- PAGE 5: ABOUT & CONTACT -->
<section class="page" data-page="contact" hidden>
  <header class="page-head">
    <div class="wrap">
      <h1 tabindex="-1" data-i18n="contact.title"></h1>
      <p data-i18n="contact.intro"></p>
    </div>
  </header>
  <section class="band">
    <div class="wrap contact-grid">
      <div>
        <div class="about">
          <h2 data-cfg="owner"></h2>
          <p class="role" data-i18n="contact.role"></p>
          <p data-i18n="contact.about1"></p>
          <p data-i18n="contact.about2"></p>
          <dl class="log">
            <div><dt data-i18n="contact.logYears"></dt><dd data-cfg="yearsAtSea"></dd></div>
            <div><dt data-i18n="contact.logMiles"></dt><dd id="miles"></dd></div>
            <div><dt data-i18n="contact.logLicence"></dt><dd class="small" id="licence"></dd></div>
          </dl>
        </div>
        <h2 class="details-h" data-i18n="contact.detailsTitle"></h2>
        <dl class="info">
          <dt data-i18n="contact.phone"></dt>
          <dd><a data-href="tel" data-cfg="phoneDisplay"></a></dd>
          <dt data-i18n="contact.email"></dt>
          <dd><a data-href="mail" data-cfg="email"></a></dd>
          <dt>Instagram</dt>
          <dd><a data-href="ig" target="_blank" rel="noopener" data-cfg="instagramDisplay"></a></dd>
          <dt data-i18n="contact.where"></dt>
          <dd data-cfg="address"></dd>
          <dt data-i18n="contact.hours"></dt>
          <dd data-i18n="contact.hoursVal"></dd>
        </dl>
      </div>

      <div class="form-card">
        <h2 data-i18n="form.title"></h2>
        <div class="field">
          <label for="f-name" data-i18n="form.name"></label>
          <input id="f-name" type="text" autocomplete="name">
        </div>
        <div class="field">
          <label for="f-contact" data-i18n="form.contact"></label>
          <input id="f-contact" type="text" autocomplete="email">
        </div>
        <div class="field">
          <label for="f-service" data-i18n="form.service"></label>
          <select id="f-service"></select>
        </div>
        <div class="field">
          <label for="f-msg" data-i18n="form.message"></label>
          <textarea id="f-msg" data-i18n-ph="form.ph"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn" id="send-wa" data-i18n="form.wa"></button>
          <button type="button" class="btn btn-ghost" id="send-mail" data-i18n="form.mail"></button>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
        <p class="form-note" data-i18n="form.note"></p>
      </div>

    paras: [
      "Responsable du traitement" + NB + ": {owner}, {address}. Contact" + NB + ": {email}.",
      "Ce site statique est hébergé par GitHub Pages, qui enregistre les adresses IP des visiteurs pour des raisons techniques et de sécurité.",
      "Le site ne collecte aucune donnée par formulaire. Le formulaire de contact ouvre WhatsApp ou votre messagerie, et nous utilisons vos informations uniquement pour vous répondre et fournir le service demandé.",
      "Les polices sont intégrées au site et ne sont pas chargées depuis des services externes. La carte Google Maps ne se charge qu'après votre accord. Google traite alors les données selon sa propre politique de confidentialité.",
      "Vous pouvez à tout moment demander l'accès, la rectification ou la suppression de vos données en écrivant à {email}, et déposer une réclamation auprès de l'autorité italienne de protection des données (Garante)."
    ]
  },
  footer: { rights: "Tous droits réservés.", vat: "N° TVA" }
}
};

/* ============================================================
   NAUTICAL CHART (drawn in SVG, schematic)
   ============================================================ */
function chartSVG(mode) {
  const N = "#0F2A44", S = "#E4EDF4", L = "#C8D5E0", B = "#9C7A2E", R = "#B3322B";
  const land = "M0,480 L0,300 C15,280 30,250 40,225 C48,210 55,200 62,196 C70,200 74,215 76,232 C80,250 90,270 105,290 C120,310 135,330 155,342 C185,352 215,354 238,358 C265,368 295,378 330,382 C360,382 380,370 405,352 C445,322 490,285 525,262 C545,250 575,238 600,232 L600,480 Z";
  const isl = "M72,184 C66,172 70,158 80,150 C86,138 84,124 94,112 C104,100 112,92 120,78 C128,62 140,44 150,32 C158,22 168,18 172,26 C176,36 168,48 172,60 C178,72 184,84 176,96 C166,104 158,112 150,124 C140,140 128,150 118,162 C104,176 88,188 72,184 Z";
  const depths = [[180,322,"8"],[330,366,"11"],[420,318,"9"],[220,282,"19"],[352,306,"22"],[470,262,"21"],[140,252,"12"],[272,200,"36"],[392,214,"41"],[500,172,"48"],[330,122,"57"],[230,92,"52"],[430,118,"66"],[562,204,"34"],[20,180,"58"],[26,108,"71"]];
  let s = `<svg viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg" role="img">`;
  s += `<rect width="600" height="480" fill="#fff"/>`;
  [180,330,480].forEach(x => s += `<line x1="${x}" y1="0" x2="${x}" y2="480" stroke="${L}" stroke-width="0.8"/>`);
  [60,160,260,360].forEach(y => s += `<line x1="0" y1="${y}" x2="600" y2="${y}" stroke="${L}" stroke-width="0.8"/>`);
  s += `<text x="184" y="12" class="c-grid">8°20′E</text><text x="334" y="12" class="c-grid">8°30′E</text><text x="484" y="12" class="c-grid">8°40′E</text>`;
  s += `<text x="4" y="56" class="c-grid">41°05′N</text><text x="4" y="156" class="c-grid">41°00′N</text>`;
  s += `<path d="M95,160 C150,200 230,215 300,185 C370,160 430,180 480,150 C520,128 560,150 600,140" fill="none" stroke="${N}" stroke-width="0.8" stroke-dasharray="5 4" opacity=".45"/>`;
  s += `<path d="${land}" fill="${S}" stroke="${S}" stroke-width="36" stroke-linejoin="round"/>`;
  s += `<path d="${isl}" fill="${S}" stroke="${S}" stroke-width="30" stroke-linejoin="round"/>`;
  s += `<path d="${land}" fill="${N}"/><path d="${isl}" fill="${N}"/>`;
  depths.forEach(([x,y,d]) => s += `<text x="${x}" y="${y}" class="c-depth" text-anchor="middle">${d}</text>`);
  s += `<text x="335" y="258" class="c-water" text-anchor="middle">Golfo dell'Asinara</text>`;
  s += `<text x="400" y="452" class="c-region" text-anchor="middle">SARDEGNA</text>`;
  s += `<text x="238" y="392" class="c-land" text-anchor="middle">Porto Torres</text>`;
  s += `<text x="54" y="266" class="c-land" text-anchor="middle" font-size="11">Stintino</text>`;
  s += `<text x="545" y="300" class="c-land" text-anchor="middle">Castelsardo</text>`;
  s += `<text x="0" y="0" class="c-land" font-size="11" transform="translate(118,122) rotate(-58)" text-anchor="middle">Asinara</text>`;
  s += `<g transform="translate(525,92)"><circle r="38" fill="#fff" stroke="${N}"/><circle r="31" fill="none" stroke="${L}"/>`;
  s += `<path d="M0,-36 L6,0 L0,36 L-6,0Z" fill="none" stroke="${N}"/><path d="M0,-36 L6,0 L-6,0Z" fill="${N}"/>`;
  s += `<path d="M-36,0 L0,-5 L36,0 L0,5Z" fill="none" stroke="${N}"/><text y="-43" class="c-n">N</text></g>`;
  s += `<g transform="translate(300,26)"><rect width="100" height="5" fill="#fff" stroke="${N}" stroke-width=".8"/><rect width="20" height="5" fill="${N}"/><rect x="40" width="20" height="5" fill="${N}"/><rect x="80" width="20" height="5" fill="${N}"/>`;
  s += `<text x="0" y="17" class="c-grid">0</text><text x="100" y="17" class="c-grid" text-anchor="end">5 NM</text></g>`;
  if (mode === "hero") {
    s += `<path d="M240,346 C250,280 222,170 198,98" fill="none" stroke="${B}" stroke-width="2.2" stroke-linecap="round" pathLength="1" class="route-anim"/>`;
    s += `<g class="sail-anim"><path d="M196,68 L196,86 L184,86 Z" fill="${B}"/><path d="M181,89 L201,89 L197,94 L185,94 Z" fill="${N}"/></g>`;
  } else {
    ["M240,346 C250,280 222,170 198,98", "M236,350 C200,300 140,250 104,216", "M246,350 C320,330 430,290 503,248"]
      .forEach(d => s += `<path d="${d}" fill="none" stroke="${B}" stroke-width="1.8" stroke-dasharray="2 5" stroke-linecap="round"/>`);
    [[196,86,1],[92,208,2],[515,240,3]].forEach(([x,y,n]) =>
      s += `<circle cx="${x}" cy="${y}" r="11" fill="${B}" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y+4}" class="c-num">${n}</text>`);
  }
  s += `<path d="M231,352 L225,336 L238,331 M247,350 L258,337" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>`;
  s += `<circle cx="240" cy="352" r="5.5" fill="${R}" stroke="#fff" stroke-width="2"/>`;
  if (mode === "hero") s += `<text x="262" y="344" class="c-coord">40°50′N 8°24′E</text>`;
  s += `</svg>`;
  return s;
}

/* ============================================================
   APP LOGIC
   ============================================================ */
const LANGS = ["it", "en", "de", "fr"];
const PAGES = ["home", "cleaning", "sailing", "skipper", "contact"];
const LOCALES = { it: "it-IT", en: "en-GB", de: "de-DE", fr: "fr-FR" };
const $ = (q) => document.querySelector(q);
const $$ = (q) => document.querySelectorAll(q);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const params = new URLSearchParams(location.search);
let lang = params.get("lang");
if (!LANGS.includes(lang)) {
  const nav = (navigator.language || "it").slice(0, 2).toLowerCase();
  lang = LANGS.includes(nav) ? nav : "it";
}
let currentPage = "home";
let pendingService = null;
let mapConsent = null; // null = not chosen yet, true = accepted, false = declined (kept for this visit)

function t(path) {
  return path.split(".").reduce((o, k) => (o == null ? o : o[k]), T[lang]) ?? "";
}
function fmt(str) {
  return String(str)
    .replaceAll("{owner}", CONFIG.owner).replaceAll("{years}", CONFIG.yearsAtSea)
    .replaceAll("{email}", CONFIG.email).replaceAll("{address}", CONFIG.address);
}

function applyConfig() {
  CONFIG.instagramDisplay = "@" + CONFIG.instagram;
  $$("[data-cfg]").forEach(el => el.textContent = CONFIG[el.dataset.cfg] || "");
  const hrefs = {
    tel: "tel:+" + CONFIG.phoneIntl,
    mail: "mailto:" + CONFIG.email,
    wa: "https://wa.me/" + CONFIG.phoneIntl,
    ig: "https://instagram.com/" + CONFIG.instagram,
    gmaps: CONFIG.mapLink
  };
  $$("[data-href]").forEach(el => el.setAttribute("href", hrefs[el.dataset.href]));
  $("#year").textContent = new Date().getFullYear();
}

function renderLists() {
  const L = T[lang];
  $("#svc-list").innerHTML = L.home.svc.map(s =>
    `<li><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p><a href="#${s.link}" aria-label="${esc(L.home.details + ": " + s.t)}">${esc(L.home.details)}</a></li>`).join("");
  $("#how-list").innerHTML = L.home.how.map(h => `<div><h3>${esc(h.t)}</h3><p>${esc(h.d)}</p></div>`).join("");
  $("#clean-blocks").innerHTML = L.clean.blocks.map(b =>
    `<div class="block"><h3>${esc(b.t)}</h3><p>${esc(b.d)}</p><ul class="checks">${b.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("");
  const steps = arr => arr.map(s => `<li><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p></li>`).join("");
  $("#clean-steps").innerHTML = steps(L.clean.steps);
  $("#skipper-steps").innerHTML = steps(L.skipper.steps);
  const checks = arr => arr.map(i => `<li>${esc(i)}</li>`).join("");
  $("#delivery-items").innerHTML = checks(L.skipper.deliveryItems);
  $("#hire-items").innerHTML = checks(L.skipper.hireItems);
  const rows = arr => arr.map(r => `<div class="row"><h3>${esc(r.t)}</h3><span class="dur">${esc(r.dur)}</span><p>${esc(r.d)}</p></div>`).join("");
  $("#trips").innerHTML = rows(L.sail.trips);
  $("#lessons").innerHTML = rows(L.sail.lessons);
  $("#dest").innerHTML = L.sail.dest.map((d, i) =>
    `<li><span class="n" aria-hidden="true">${i + 1}</span><div><h3>${esc(d.t)}</h3><p>${esc(d.d)}</p></div></li>`).join("");
  $("#faq").innerHTML = L.sail.faq.map(f => `<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("");
  $("#privacy-body").innerHTML = L.privacy.paras.map(p => `<p>${esc(fmt(p))}</p>`).join("");
  $("#miles").textContent = Number(CONFIG.milesSailed).toLocaleString(LOCALES[lang]);
  $("#licence").textContent = CONFIG.licence[lang] || CONFIG.licence.it;
  const sel = $("#f-service"), prev = sel.value;
  sel.innerHTML = Object.entries(L.form.opts).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
  if (prev) sel.value = prev;
}

function applyLang() {
  document.documentElement.lang = lang;
  $$("[data-i18n]").forEach(el => el.textContent = fmt(t(el.dataset.i18n)));
  $$("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $$("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  $$("[data-i18n-title]").forEach(el => el.title = t(el.dataset.i18nTitle));
  $$(".chart svg").forEach(svg => svg.setAttribute("aria-label", t("chart.aria")));
  $$(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  renderLists();
  $("#form-error").textContent = "";
  updateTitle();
  history.replaceState(null, "", "?lang=" + lang + location.hash);
}

function updateTitle() {
  const label = t("nav." + currentPage);
  document.title = (currentPage === "home" ? "" : label + " | ") + CONFIG.name + ", Porto Torres";
}

function route(initial) {
  const id = location.hash.slice(1);
  if (!PAGES.includes(id) && !initial) return;
  currentPage = PAGES.includes(id) ? id : "home";
  $$(".page").forEach(p => p.hidden = p.dataset.page !== currentPage);
  $$("#nav a, footer nav a").forEach(a => {
    if (a.getAttribute("href") === "#" + currentPage) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  if (currentPage === "contact" && pendingService) {
    $("#f-service").value = pendingService;
    pendingService = null;
  }
  closeMenu();
  updateTitle();
  if (!initial) {
    window.scrollTo(0, 0);
    const h = $(`.page[data-page="${currentPage}"] h1`);
    if (h) h.focus({ preventScroll: true });
  }
}

function closeMenu() {
  $("#nav").classList.remove("open");
  $(".menu-btn").setAttribute("aria-expanded", "false");
}

/* Cookie consent: the Google Maps iframe loads only after consent */
function setMapConsent(value) {
  mapConsent = value;
  const frame = $("#map-frame");
  if (value) {
    if (!frame.src) frame.src = CONFIG.mapEmbed;
    frame.hidden = false;
    $("#map-ph").hidden = true;
  } else {
    frame.removeAttribute("src");
    frame.hidden = true;
    $("#map-ph").hidden = false;
  }
  showBanner(false);
}
function showBanner(show) {
  $("#cookie").hidden = !show;
  document.body.classList.toggle("ck-open", show);
}

function compose() {
  const name = $("#f-name").value.trim();
  const contact = $("#f-contact").value.trim();
  const sel = $("#f-service");
  const service = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : "";
  const msg = $("#f-msg").value.trim();
  const err = $("#form-error");
  if (!name || !msg) {
    err.textContent = t("form.error");
    (!name ? $("#f-name") : $("#f-msg")).focus();
    return null;
  }
  err.textContent = "";
  return `${t("form.hello")} ${name}.\n${t("form.service")}: ${service}\n${t("form.recap")}: ${contact || "-"}\n\n${msg}`;
}

/* Init */
$("#chart-hero").innerHTML = chartSVG("hero");
$("#chart-dest").innerHTML = chartSVG("dest");
applyConfig();
applyLang();
route(true);
showBanner(true);

window.addEventListener("hashchange", () => route(false));
$$(".lang button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; applyLang(); }));
$(".menu-btn").addEventListener("click", () => {
  const open = $("#nav").classList.toggle("open");
  $(".menu-btn").setAttribute("aria-expanded", String(open));
});
$("#skip").addEventListener("click", e => { e.preventDefault(); $("#main").focus(); });
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-svc]");
  if (a) pendingService = a.dataset.svc;
});
$("#ck-accept").addEventListener("click", () => setMapConsent(true));
$("#ck-reject").addEventListener("click", () => setMapConsent(false));
$("#map-load").addEventListener("click", () => setMapConsent(true));
$("#ck-settings").addEventListener("click", () => { showBanner(true); $("#ck-accept").focus(); });
$$("[data-open-privacy]").forEach(b => b.addEventListener("click", () => $("#privacy").showModal()));
$("#privacy-close").addEventListener("click", () => $("#privacy").close());
$("#send-wa").addEventListener("click", () => {
  const text = compose();
  if (text) window.open("https://wa.me/" + CONFIG.phoneIntl + "?text=" + encodeURIComponent(text), "_blank", "noopener");
});
$("#send-mail").addEventListener("click", () => {
  const text = compose();
  if (text) location.href = "mailto:" + CONFIG.email + "?subject=" + encodeURIComponent(t("form.subject")) + "&body=" + encodeURIComponent(text);
});
</script>
</body>
</html>
